<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JobLink | Create Account</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="signup.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="shape shape1"></div>
<div class="shape shape2"></div>

<div class="container">

    <div class="left-panel">

        <div class="logo">
            Job<span>Link</span>
        </div>

        <h1 id="heroTitle">Find Your Next Opportunity</h1>

        <p id="heroSubtitle">
            Join thousands of job seekers and let JobLink's AI
            connect you with opportunities that match your skills.
        </p>

        <div class="feature" id="feature1">
            <i class="fa-solid fa-robot"></i>
            AI Resume Builder
        </div>

        <div class="feature" id="feature2">
            <i class="fa-solid fa-briefcase"></i>
            Smart Job Matching
        </div>

        <div class="feature" id="feature3">
            <i class="fa-solid fa-chart-line"></i>
            Career Growth Insights
        </div>

    </div>

    <div class="right-panel">

        <div class="signup-card">

            <h2>Join JobLink</h2>
            <p class="signup-subtitle">Create your free account in under a minute.</p>

            <!-- ================= ROLE SELECTOR ================= -->
            <div class="role-selector">

                <button type="button" class="role-card active" id="roleUserBtn" data-role="user">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span class="role-title">I'm looking for a job</span>
                    <span class="role-subtitle">Build a resume, get matched, apply</span>
                </button>

                <button type="button" class="role-card" id="roleEmployerBtn" data-role="employer">
                    <i class="fa-solid fa-building"></i>
                    <span class="role-title">I'm hiring</span>
                    <span class="role-subtitle">Post jobs, find candidates</span>
                </button>

            </div>

            <form id="signupForm">

                <div class="input-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="e.g. Juan Dela Cruz" required>
                </div>

                <div class="input-group" id="companyNameGroup" hidden>
                    <label for="companyName">Company Name</label>
                    <input type="text" id="companyName" placeholder="e.g. Acme Corporation">
                </div>

                <div class="input-group">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" placeholder="e.g. juan@email.com" required>
                </div>

                <div class="input-group">
                    <label for="signupPass">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="signupPass" placeholder="At least 8 characters" required minlength="8">
                        <i class="fa-solid fa-eye" id="togglePassword"></i>
                    </div>
                    <div class="password-strength" id="passwordStrength" hidden>
                        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                        <span class="strength-label" id="strengthLabel"></span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="signupConfirm">Confirm Password</label>
                    <input type="password" id="signupConfirm" placeholder="Re-enter your password" required>
                </div>

                <input type="hidden" id="accountRole" value="user">

                <label class="terms-row">
                    <input type="checkbox" id="agreeTerms" required>
                    <span>I agree to JobLink's <a href="terms.html" target="_blank" rel="noopener">Terms of Service</a> and <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a></span>
                </label>

                <button type="submit" id="signupSubmit" class="btn">
                    Create Account
                </button>

            </form>

            <p class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

</div>

<script src="auth.js"></script>

</body>
</html>
